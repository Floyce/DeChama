version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: impact_chain_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-impact_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-impact_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-impact_chain}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: impact_chain_api
    depends_on:
      - db
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://impact_user:impact_pass_2026@db:5432/impact_chain
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: impact_chain_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@impactchain.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

volumes:
  postgres_data:
  pgadmin_data:
